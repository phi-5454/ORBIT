# TODO: scheduling, optimization?

lr: 1e-3
deepsets_initial_lr: 0.002
deepsets_max_lr: 0.005
deepsets_final_lr: 0.001
transformer_initial_lr: 0.0001
transformer_max_lr: 0.001
transformer_final_lr: 0.0003
lr_warmup_epochs: 4
lr_decay_to_initial_epochs: 20
lr_update_interval_steps: 1 # Set to 100 to update the scheduler every 100 optimizer steps.
#hidden_dim: 64
hidden_dim: 128
batch_size: 32
latent_nodes: 32
quantizer: "fsq" # Backward-compatible default for both branches: "fsq" or "vq"
mu_quantizer: null # Optional branch override: "fsq" or "vq"
alpha_quantizer: null # Optional branch override: "fsq" or "vq"
fsq_mu_levels: [5, 4, 4, 3, 3, 3, 2, 2]
#fsq_mu_levels: [64, 64, 64, 64, 32, 32, 32, 16, 16, 8, 8, 4, 4]
fsq_alpha_levels: [1024]
#fsq_alpha_levels: [8096]
#fsq_alpha_levels: [65536]
vq_mu_dim: 3
vq_alpha_dim: 0
vq_mu_num_codes: 1024
vq_alpha_num_codes: 0
vq_beta: 0.95
vq_gradient_estimator: "ste" # "ste" or "rotation_trick"
vq_kmeans_init: False
vq_sync_nu: 2.0
vq_affine_lr: 10.0
vq_affine_groups: 1
vq_replace_freq: 0
vq_commitment_update_frequency: 4
vq_loss_mode: "split" # "split" or "vqtorch"
window_particles: 128
#window_particles: 256
#window_particles: 1024
#num_heads: 4
#num_layers: 2
num_heads: 8
num_enc_dec_layers: 4
normformer_mlp_expansion_factor: 4
normformer_dropout: 0.1
weight_decay: 0.01
commit_beta: 0.25
beta_mu: 0.25
beta_alpha: 1.0
reconstruction_loss: "l1" # "l1" or "l2"
skip_quantization: False
use_attention: True
diagnostic_max_events: 8
# TODO: early stopping
# TODO: Gradient clipping
