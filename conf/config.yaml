defaults:
  - hyperparams: default_hyperparams.yaml
  - trainer: default_trainer.yaml
  - model: default_model.yaml
  - replot: default_replot.yaml

run_name: "test_run"
wandb_env: "../wandb_api_key.env"
# May be a single .txt file or a list of .txt files.
# Example: ["./trainval_file_lists/VBFHbb.txt", "./trainval_file_lists/ggHbb.txt"]
train_val_files: "./pq_files_train_val.txt"
test_files: "./pq_files_test.txt"
output_dir: "outputs/"
train_val_split: [0.80, 0.20]
split_random_seed: 42
shuffle_train: True
run_validation: True
run_test: False
earlystopping_patience: 5
num_dataload_workers: 0
num_eval_workers: 8
eval_worker_backend: "process" # "process" or "thread"
eval_worker_start_method: "forkserver" # "fork", "forkserver", or "spawn"
replot_only: False
mode: "train" #or "test_only"
ckpt_path: "./some_model.ckpt" # to load model from for test_only.

data:
  level: "particle" # "particle" or "jet"
  particle:
    features:
      - "L1T_PUPPIPart_Eta"
      - "L1T_PUPPIPart_Phi"
      - "L1T_PUPPIPart_PT"
      - "L1T_PUPPIPart_PID"
      - "L1T_PUPPIPart_PuppiW"
    selected_features:
      - "L1T_PUPPIPart_Eta"
      - "L1T_PUPPIPart_Phi"
      - "L1T_PUPPIPart_PT"
    mask_column: "L1T_PUPPIPart_PuppiW"
    mask_min_value: 0.05
  jet:
    features:
      - "L1T_JetAK4_Eta"
      - "L1T_JetAK4_Phi"
      - "L1T_JetAK4_PT"
    selected_features:
      - "L1T_JetAK4_Eta"
      - "L1T_JetAK4_Phi"
      - "L1T_JetAK4_PT"
    mask_column: null
    mask_min_value: 0.0

multirun:
  enabled: False
  name: "codebook_size_scan"
  suite_id: null
  job_index: 0
  job_count: 1
  collect_only: False
  seeds: [42]
  y_metrics:
    - "metrics/mse_Eta"
    - "metrics/mse_Phi"
    - "metrics/mse_pT"
  codebook_configs:
    - label: "fsq_10"
      fsq_mu_levels: [10, 10, 10]
      fsq_alpha_levels: []
    - label: "fsq_15"
      fsq_mu_levels: [15, 15, 15]
      fsq_alpha_levels: []
    - label: "fsq_21"
      fsq_mu_levels: [21, 21, 21]
      fsq_alpha_levels: []
    - label: "fsq_21_mlp"
      fsq_mu_levels: [21, 21, 21]
      fsq_alpha_levels: []
      use_attention: False
    - label: "fsq_25"
      fsq_mu_levels: [25, 25, 25]
      fsq_alpha_levels: []
    - label: "fsq_35"
      fsq_mu_levels: [35, 35, 35]
      fsq_alpha_levels: []
    - label: "fsq_42"
      fsq_mu_levels: [42, 42, 42]
      fsq_alpha_levels: []
    - label: "vq_256_ste"
      quantizer: "vq"
      mu_quantizer: "vq"
      alpha_quantizer: "vq"
      fsq_mu_levels: []
      fsq_alpha_levels: []
      vq_mu_dim: 4
      vq_alpha_dim: 0
      vq_mu_num_codes: 256
      vq_alpha_num_codes: 0
      vq_gradient_estimator: "ste"
      beta_mu: 10.0
      beta_alpha: 10.0
      vq_beta: 0.9
      vq_loss_mode: "vqtorch"
      vq_sync_nu: 1.0
      vq_affine_lr: 10.0
      vq_affine_groups: 1
      vq_replace_freq: 10
      vq_commitment_update_frequency: 1
    - label: "vq_512_ste"
      quantizer: "vq"
      mu_quantizer: "vq"
      alpha_quantizer: "vq"
      fsq_mu_levels: []
      fsq_alpha_levels: []
      vq_mu_dim: 4
      vq_alpha_dim: 0
      vq_mu_num_codes: 512
      vq_alpha_num_codes: 0
      vq_gradient_estimator: "ste"
      beta_mu: 10.0
      beta_alpha: 10.0
      vq_beta: 0.9
      vq_loss_mode: "vqtorch"
      vq_sync_nu: 1.0
      vq_affine_lr: 10.0
      vq_affine_groups: 1
      vq_replace_freq: 10
      vq_commitment_update_frequency: 1
    - label: "vq_512_ste_mlp"
      quantizer: "vq"
      mu_quantizer: "vq"
      alpha_quantizer: "vq"
      fsq_mu_levels: []
      fsq_alpha_levels: []
