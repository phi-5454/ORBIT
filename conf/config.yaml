defaults:
  - hyperparams: default_hyperparams.yaml
  - trainer: default_trainer.yaml
  - model: default_model.yaml
  - replot: default_replot.yaml

run_name: "test_run"
wandb_env: "../wandb_api_key.env"
# May be a single .txt file or a list of .txt files.
# Example: ["./trainval_file_lists/VBFHbb.txt", "./trainval_file_lists/ggHbb.txt"]
train_val_files: "./pq_files_train_val.txt"
test_files: "./pq_files_test.txt"
output_dir: "outputs/"
train_val_split: [0.80, 0.20]
split_random_seed: 42
shuffle_train: True
run_validation: True
run_test: False
earlystopping_patience: 5
num_dataload_workers: 0
replot_only: False
mode: "train" #or "test_only"
ckpt_path: "./some_model.ckpt" # to load model from for test_only.

data:
  level: "particle" # "particle" or "jet"
  particle:
    features:
      - "L1T_PUPPIPart_Eta"
      - "L1T_PUPPIPart_Phi"
      - "L1T_PUPPIPart_PT"
      - "L1T_PUPPIPart_PID"
      - "L1T_PUPPIPart_PuppiW"
    selected_features:
      - "L1T_PUPPIPart_Eta"
      - "L1T_PUPPIPart_Phi"
      - "L1T_PUPPIPart_PT"
    mask_column: "L1T_PUPPIPart_PuppiW"
    mask_min_value: 0.05
  jet:
    features:
      - "L1T_JetAK4_Eta"
      - "L1T_JetAK4_Phi"
      - "L1T_JetAK4_PT"
    selected_features:
      - "L1T_JetAK4_Eta"
      - "L1T_JetAK4_Phi"
      - "L1T_JetAK4_PT"
    mask_column: null
    mask_min_value: 0.0

multirun:
  enabled: False
  name: "codebook_size_scan"
  suite_id: null
  job_index: 0
  job_count: 1
  collect_only: False
  seeds: [42]
  y_metrics:
    - "metrics/mse_Eta"
    - "metrics/mse_Phi"
    - "metrics/mse_pT"
  codebook_configs:
    - label: "mu_5x4x4_alpha_1024"
      fsq_mu_levels: [5, 4, 4]
      fsq_alpha_levels: [1024]
    - label: "mu_8x8x4_alpha_1024"
      fsq_mu_levels: [8, 8, 4]
      fsq_alpha_levels: [1024]
