defaults:
  - hyperparams: default_hyperparams.yaml
  - trainer: default_trainer.yaml
  - model: default_model.yaml
  - replot: default_replot.yaml

run_name: "test_run"
wandb_env: "../wandb_api_key.env"
# May be a single .txt file or a list of .txt files.
# Example: ["./trainval_file_lists/VBFHbb.txt", "./trainval_file_lists/ggHbb.txt"]
train_val_files: "./pq_files_train_val.txt"
test_files: "./pq_files_test.txt"
output_dir: "outputs/"
train_val_split: [0.80, 0.20]
split_random_seed: 42
shuffle_train: True
run_validation: True
run_test: False
earlystopping_patience: 5
num_dataload_workers: 0
replot_only: False
mode: "train" #or "test_only"
ckpt_path: "./some_model.ckpt" # to load model from for test_only.
